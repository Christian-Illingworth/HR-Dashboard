<!doctype html>
<html lang="en">
<head>

<title>Loading · CU Web Design Kit</title>
<link rel="icon" type="image/png" href="logo/favicon-32.png">
<link rel="preload" href="fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>

<body>
  <!-- Standalone page: sign-in, loading, no access. The colour logo on the light page, one card. -->

    <img class="standalone-logo" src="logo/cu-logo-150.png" srcset="logo/cu-logo-150.png 1x, logo/cu-logo-250.png 2x" alt="Consultiv Utilities">
    <div class="standalone-card">

      <p>This takes about a minute the first time each morning.</p>
      <ul class="load-steps">
        <li class="is-done"><span class="load-mark"></span>Signed in as Sam Taylor</li>
        <li class="is-active"><span class="load-mark"></span>Loading tickets</li>
        <li><span class="load-mark"></span>Building the overview</li>
      </ul>
      <div class="load-bar"><span></span></div>
      <div class="standalone-actions">
        <a class="btn-secondary" href="index.html">Back to the kit</a>
      </div>
    </div>
